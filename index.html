<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر العطور</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
body { background: #f5f3ef; color: #2c2c2c; min-height: 100vh; padding-bottom: 40px; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
.header { text-align: center; padding: 30px 20px; background: linear-gradient(135deg, #1a1a1a, #2c2c2c); color: #d4af37; border-radius: 0 0 24px 24px; margin-bottom: 24px; }
.header h1 { font-size: 1.8rem; font-weight: 900; letter-spacing: 1px; }
.header p { color: #999; margin-top: 6px; font-size: 0.9rem; }
.step-title { font-size: 1.3rem; font-weight: 900; color: #1a1a1a; margin-bottom: 16px; text-align: center; }
.step-title small { display: block; color: #888; font-size: 0.8rem; font-weight: 400; margin-top: 4px; }
.options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 24px; }
.option-btn { background: #fff; border: 2px solid #e0dcd0; border-radius: 14px; padding: 20px 12px; cursor: pointer; transition: all 0.2s; text-align: center; font-weight: 700; color: #1a1a1a; font-size: 1rem; }
.option-btn:hover { border-color: #d4af37; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(212,175,55,0.2); }
.option-btn.active { background: linear-gradient(135deg, #d4af37, #b8942e); color: #fff; border-color: #b8942e; }
.option-btn img { width: 70px; height: 70px; object-fit: contain; display: block; margin: 0 auto 8px; border-radius: 8px; }
.option-btn .price-tag { font-size: 0.75rem; color: #666; font-weight: 500; margin-top: 4px; }
.option-btn.active .price-tag { color: #fff; opacity: 0.9; }
.nav-bar { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
.btn { padding: 12px 24px; border: none; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; font-family: inherit; }
.btn-primary { background: linear-gradient(135deg, #d4af37, #b8942e); color: #fff; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(212,175,55,0.4); }
.btn-dark { background: #1a1a1a; color: #fff; }
.btn-danger { background: #e74c3c; color: #fff; }
.btn-success { background: #25d366; color: #fff; }
.btn-sm { padding: 8px 16px; font-size: 0.85rem; }
.perfume-list { display: grid; gap: 12px; }
.perfume-item { background: #fff; border: 2px solid #e0dcd0; border-radius: 14px; padding: 18px 20px; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
.perfume-item:hover { border-color: #d4af37; transform: translateX(-4px); box-shadow: 0 6px 16px rgba(212,175,55,0.15); }
.perfume-item .name { font-weight: 800; font-size: 1.05rem; color: #1a1a1a; }
.perfume-item .brand { font-size: 0.8rem; color: #888; margin-top: 2px; }
.perfume-item .price { font-weight: 900; color: #b8942e; font-size: 1.1rem; }
.detail-card { background: #fff; border-radius: 18px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); margin-bottom: 20px; }
.detail-card h2 { font-size: 1.5rem; font-weight: 900; color: #1a1a1a; margin-bottom: 6px; }
.detail-card .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 18px; }
.detail-row { display: flex; padding: 10px 0; border-bottom: 1px solid #f0ede6; font-size: 0.95rem; }
.detail-row:last-child { border-bottom: none; }
.detail-row .label { font-weight: 700; color: #666; min-width: 110px; }
.detail-row .value { color: #1a1a1a; flex: 1; }
.notes-section { background: #faf8f3; border-radius: 12px; padding: 16px; margin: 16px 0; }
.notes-section h4 { color: #b8942e; font-size: 0.9rem; margin-bottom: 10px; }
.note-item { display: flex; gap: 8px; padding: 6px 0; font-size: 0.9rem; }
.note-item .note-label { font-weight: 700; color: #666; min-width: 80px; }
.total-box { background: linear-gradient(135deg, #1a1a1a, #2c2c2c); color: #fff; border-radius: 14px; padding: 20px; text-align: center; margin-top: 20px; }
.total-box .label { font-size: 0.9rem; color: #999; }
.total-box .amount { font-size: 2rem; font-weight: 900; color: #d4af37; margin-top: 4px; }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
.modal.open { display: flex; }
.modal-content { background: #fff; border-radius: 18px; padding: 24px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
.modal-content h2 { font-size: 1.3rem; margin-bottom: 16px; color: #1a1a1a; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-weight: 700; font-size: 0.85rem; color: #666; margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 2px solid #e0dcd0; border-radius: 10px; font-size: 0.95rem; font-family: inherit; background: #faf8f3; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #d4af37; background: #fff; }
.admin-bar { background: linear-gradient(135deg, #1a1a1a, #2c2c2c); color: #d4af37; padding: 14px 20px; border-radius: 14px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.admin-bar strong { font-weight: 800; }
.admin-bar .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.tab-bar { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.tab-btn { background: #f0ede6; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; cursor: pointer; color: #666; }
.tab-btn.active { background: #1a1a1a; color: #d4af37; }
.admin-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #faf8f3; border-radius: 10px; margin-bottom: 8px; gap: 10px; }
.admin-item .info { flex: 1; }
.admin-item .info strong { color: #1a1a1a; }
.admin-item .info small { color: #888; display: block; font-size: 0.75rem; }
.admin-item .actions { display: flex; gap: 6px; }
.admin-item img { width: 50px; height: 50px; object-fit: contain; border-radius: 8px; background: #fff; }
.empty { text-align: center; padding: 40px 20px; color: #999; }
.loading { text-align: center; padding: 40px; color: #d4af37; font-weight: 700; }
.price-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; margin-top: 12px; }
.price-table th, .price-table td { padding: 10px; text-align: center; border-bottom: 1px solid #f0ede6; font-size: 0.9rem; }
.price-table th { background: #1a1a1a; color: #d4af37; font-weight: 700; }
.price-table td input { width: 90px; padding: 6px 8px; border: 2px solid #e0dcd0; border-radius: 6px; text-align: center; font-family: inherit; font-size: 0.9rem; }
.price-table td input:focus { outline: none; border-color: #d4af37; }
.whatsapp-float { position: fixed; bottom: 20px; left: 20px; background: #25d366; color: #fff; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(37,211,102,0.5); cursor: pointer; border: none; font-size: 1.5rem; z-index: 99; }
#secretDot { position: fixed; bottom: 5px; right: 5px; width: 20px; height: 20px; cursor: pointer; z-index: 9999; }
@media (max-width: 600px) {
  .header h1 { font-size: 1.4rem; }
  .step-title { font-size: 1.1rem; }
  .option-btn { padding: 14px 8px; font-size: 0.9rem; }
  .option-btn img { width: 55px; height: 55px; }
  .price-table td input { width: 70px; }
}
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <h1>متجر العطور</h1>
    <p>اختر عطرك المفضل خطوة بخطوة</p>
  </div>
  <div class="container" id="mainContainer">
    <div class="loading">جاري التحميل...</div>
  </div>
</div>

<button class="whatsapp-float" onclick="openWhatsApp()" title="تواصل معنا">💬</button>
<div id="secretDot"></div>

<div id="loginModal" class="modal">
  <div class="modal-content">
    <h2>🔐 دخول المسؤول</h2>
    <div class="form-group">
      <label>البريد الإلكتروني</label>
      <input type="email" id="login-email" dir="ltr">
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" id="login-password" dir="ltr">
    </div>
    <div class="nav-bar">
      <button class="btn btn-primary" onclick="doLogin()">دخول</button>
      <button class="btn btn-danger" onclick="closeModal('loginModal')">إغلاق</button>
    </div>
  </div>
</div>

<div id="catFormModal" class="modal">
  <div class="modal-content">
    <h2 id="catFormTitle">إضافة</h2>
    <input type="hidden" id="cat-id">
    <input type="hidden" id="cat-table">
    <div class="form-group">
      <label>الاسم</label>
      <input type="text" id="cat-name">
    </div>
    <div class="form-group" id="cat-price-diff-group" style="display:none;">
      <label>فرق السعر (₺)</label>
      <input type="number" id="cat-price-diff" value="0">
    </div>
    <div class="form-group" id="cat-size-group" style="display:none;">
      <label>الحجم المرتبط</label>
      <select id="cat-size"></select>
    </div>
    <div class="form-group" id="cat-image-group">
      <label>الصورة</label>
      <input type="file" id="cat-image" accept="image/*">
      <div id="cat-image-preview" style="margin-top:8px;"></div>
    </div>
    <div class="nav-bar">
      <button class="btn btn-primary" onclick="saveCat()">حفظ</button>
      <button class="btn btn-danger" onclick="closeModal('catFormModal')">إلغاء</button>
    </div>
  </div>
</div>

<div id="perfumeFormModal" class="modal">
  <div class="modal-content">
    <h2 id="perfumeFormTitle">إضافة عطر</h2>
    <input type="hidden" id="pf-id">
    <div class="form-group">
      <label>اسم العطر</label>
      <input type="text" id="pf-name">
    </div>
    <div class="form-group">
      <label>الماركة</label>
      <select id="pf-brand"></select>
    </div>
    <div class="form-group">
      <label>الجنس</label>
      <select id="pf-gender"></select>
    </div>
    <div class="form-group">
      <label>العائلة العطرية</label>
      <select id="pf-scent"></select>
    </div>
    <div class="form-group">
      <label>الوصف</label>
      <textarea id="pf-desc" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label>النوتة العليا</label>
      <input type="text" id="pf-top">
    </div>
    <div class="form-group">
      <label>النوتة الوسطى</label>
      <input type="text" id="pf-middle">
    </div>
    <div class="form-group">
      <label>النوتة الأساسية</label>
      <input type="text" id="pf-base">
    </div>
    <div class="nav-bar">
      <button class="btn btn-primary" onclick="savePerfume()">حفظ</button>
      <button class="btn btn-danger" onclick="closeModal('perfumeFormModal')">إلغاء</button>
    </div>
  </div>
</div>

<script>
