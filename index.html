<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Mayhem Clone</title>
<style>
  body{margin:0;background:#0d1117;display:flex;justify-content:center;
       align-items:center;height:100vh;font-family:system-ui,sans-serif;color:#fff;flex-direction:column;gap:8px;overflow:hidden}
  canvas{background:#1b2430;border:2px solid #30363d;border-radius:10px;max-width:96vw;max-height:78vh;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
  .hint{font-size:12px;color:#8b949e;text-align:center;max-width:920px;line-height:1.6}
  .hint b{color:#e6edf3}
  
  /* --- GİRİŞ EKRANI (MENÜ) CSS --- */
  #start-menu {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(13, 17, 23, 0.95); display: flex; flex-direction: column;
    justify-content: center; align-items: center; z-index: 200;
  }
  #start-menu h1 { font-size: 48px; margin: 0 0 20px 0; color: #ffd54f; text-shadow: 0 4px 10px rgba(255, 213, 79, 0.4); }
  .selection-container { display: flex; gap: 40px; margin-bottom: 30px; }
  .player-panel {
    background: #161b22; border: 2px solid #30363d; border-radius: 12px;
    padding: 20px; width: 260px; display: flex; flex-direction: column; align-items: center; gap: 15px;
  }
  .player-panel h2 { margin: 0; font-size: 20px; }
  .option-group { display: flex; gap: 10px; width: 100%; justify-content: center; }
  .option-btn {
    background: #21262d; border: 2px solid #30363d; border-radius: 8px;
    padding: 10px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .option-btn:hover { border-color: #8b949e; }
  .option-btn.selected { border-color: #4fc3f7; background: #1f2d3d; box-shadow: 0 0 10px rgba(79, 195, 247, 0.3); }
  .option-btn img { width: 48px; height: 48px; object-fit: contain; }
  .option-btn span { font-size: 12px; font-weight: bold; }
  #btn-start {
    padding: 15px 50px; background: #238636; color: #fff; border: none; border-radius: 8px;
    font-size: 22px; font-weight: bold; cursor: pointer; transition: 0.2s;
  }
  #btn-start:hover { background: #2ea043; transform: scale(1.05); }

  /* --- AYARLAR MENÜSÜ CSS --- */
  #settings-menu {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #161b22; border: 2px solid #30363d; border-radius: 12px;
    padding: 24px; width: 320px; display: none; flex-direction: column; gap: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8); z-index: 100;
  }
  #settings-menu.active { display: flex; }
  #settings-menu h2 { margin: 0 0 10px 0; text-align: center; color: #4fc3f7; }
  .setting-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .setting-row select, .setting-row input[type="range"] { width: 120px; cursor: pointer; }
  .setting-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
  #btn-close {
    margin-top: 10px; padding: 10px; background: #238636; color: #fff;
    border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px;
  }
  #btn-close:hover { background: #2ea043; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div class="hint">
  P1: <b>A/D</b> · <b>W</b> zıpla · <b>F</b> ateş · <b>G</b> bomba
  &nbsp;|&nbsp;
  P2: <b>←/→</b> · <b>↑</b> · <b>Enter</b> · <b>/</b> bomba
  &nbsp;|&nbsp;
  <b>N</b> arena değiştir · <b>R</b> yeniden başlat · <b>ESC</b> ayarlar
</div>

<!-- Giriş Ekranı (Ana Menü) -->
<div id="start-menu">
  <h1>MAYHEM CLONE</h1>
  <div class="selection-container">
    <!-- Oyuncu 1 Seçimi -->
    <div class="player-panel">
      <h2 style="color:#4fc3f7">Oyuncu 1</h2>
      <div style="font-size:12px; color:#8b949e;">Karakter</div>
      <div class="option-group" id="p1-char-group">
        <button class="option-btn" onclick="selectChar(1, 1, this)">
          <img src="oyuncu01.png" onerror="this.style.display='none'"><span>Karakter 1</span>
        </button>
        <button class="option-btn" onclick="selectChar(1, 2, this)">
          <img src="oyuncu02.png" onerror="this.style.display='none'"><span>Karakter 2</span>
        </button>
      </div>
      <div style="font-size:12px; color:#8b949e; margin-top:10px;">Silah</div>
      <div class="option-group" id="p1-wep-group">
        <button class="option-btn" onclick="selectWeapon(1, 1, this)">
          <img src="silah01.png" onerror="this.style.display='none'"><span>Silah 1</span>
        </button>
        <button class="option-btn" onclick="selectWeapon(1, 2, this)">
          <img src="silah02.png" onerror="this.style.display='none'"><span>Silah 2</span>
        </button>
      </div>
    </div>

    <!-- Oyuncu 2 Seçimi -->
    <div class="player-panel">
      <h2 style="color:#ff7043">Oyuncu 2</h2>
      <div style="font-size:12px; color:#8b949e;">Karakter</div>
      <div class="option-group" id="p2-char-group">
        <button class="option-btn" onclick="selectChar(2, 1, this)">
          <img src="oyuncu01.png" onerror="this.style.display='none'"><span>Karakter 1</span>
        </button>
        <button class="option-btn" onclick="selectChar(2, 2, this)">
          <img src="oyuncu02.png" onerror="this.style.display='none'"><span>Karakter 2</span>
        </button>
      </div>
      <div style="font-size:12px; color:#8b949e; margin-top:10px;">Silah</div>
      <div class="option-group" id="p2-wep-group">
        <button class="option-btn" onclick="selectWeapon(2, 1, this)">
          <img src="silah01.png" onerror="this.style.display='none'"><span>Silah 1</span>
        </button>
        <button class="option-btn" onclick="selectWeapon(2, 2, this)">
          <img src="silah02.png" onerror="this.style.display='none'"><span>Silah 2</span>
        </button>
      </div>
    </div>
  </div>
  <button id="btn-start">OYUNA BAŞLA</button>
</div>

<!-- Ayarlar Menüsü -->
<div id="settings-menu">
  <h2>Ayarlar</h2>
  <div class="setting-row"><span>Can Sayısı:</span><select id="set-stocks"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="5">5</option></select></div>
  <div class="setting-row"><span>Maks. Bomba:</span><select id="set-max-bombs"><option value="3">3</option><option value="5" selected>5</option><option value="10">10</option></select></div>
  <div class="setting-row"><span>Ses Seviyesi:</span><input type="range" id="set-volume" min="0" max="1" step="0.1" value="0.5"></div>
  <div class="setting-row"><span>Ekran Sarsıntısı:</span><input type="checkbox" id="set-shake" checked></div>
  <div class="setting-row"><span>Parçacık Efektleri:</span><input type="checkbox" id="set-particles" checked></div>
  <button id="btn-close">Devam Et (ESC)</button>
</div>

<script>
"use strict";
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = c.width, H = c.height;

// ================== RESİMLER ==================
const images = {
  p1: new Image(), p2: new Image(),
  w1: new Image(), w2: new Image()
};
images.p1.src = 'oyuncu01.png';
images.p2.src = 'oyuncu02.png';
images.w1.src = 'silah01.png';
images.w2.src = 'silah02.png';

// ================== SEÇİM DURUMU ==================
const selections = {
  p1Char: 1, p1Wep: 1,
  p2Char: 2, p2Wep: 2
};

window.selectChar = function(player, charId, btn) {
  selections[`p${player}Char`] = charId;
  btn.parentElement.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
};

window.selectWeapon = function(player, wepId, btn) {
  selections[`p${player}Wep`] = wepId;
  btn.parentElement.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
};

// Varsayılan seçimleri işaretle
document.querySelector('#p1-char-group .option-btn:nth-child(1)').classList.add('selected');
document.querySelector('#p1-wep-group .option-btn:nth-child(1)').classList.add('selected');
document.querySelector('#p2-char-group .option-btn:nth-child(2)').classList.add('selected');
document.querySelector('#p2-wep-group .option-btn:nth-child(2)').classList.add('selected');

document.getElementById('btn-start').onclick = () => {
  document.getElementById('start-menu').style.display = 'none';
  initAudio();
  resetGame(); // Seçimlerle oyunu başlat
};

// ================== AYARLAR ==================
const settings = { volume: 0.5, shake: true, particles: true, stocks: 3, maxBombs: 5 };
let isPaused = false;

const menu = document.getElementById('settings-menu');
const setStocks = document.getElementById('set-stocks');
const setMaxBombs = document.getElementById('set-max-bombs');
const setVolume = document.getElementById('set-volume');
const setShake = document.getElementById('set-shake');
const setParticles = document.getElementById('set-particles');
const btnClose = document.getElementById('btn-close');

function toggleMenu() {
  if(document.getElementById('start-menu').style.display !== 'none') return; // Giriş ekranındayken açma
  isPaused = !isPaused;
  menu.classList.toggle('active', isPaused);
  if (isPaused) { for(let k in keys) keys[k] = false; }
}
btnClose.onclick = toggleMenu;
setStocks.onchange = (e) => { settings.stocks = parseInt(e.target.value); resetGame(); };
setMaxBombs.onchange = (e) => { settings.maxBombs = parseInt(e.target.value); resetGame(); };
setVolume.oninput = (e) => { settings.volume = parseFloat(e.target.value); };
setShake.onchange = (e) => { settings.shake = e.target.checked; };
setParticles.onchange = (e) => { settings.particles = e.target.checked; };

// ================== SES ==================
let audioCtx = null;
function initAudio() {
  if(!audioCtx) { try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; } }
  if(audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type='sine', vol=0.12, slideTo=null){
  if(!audioCtx || settings.volume === 0) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t+dur);
  g.gain.setValueAtTime(vol * settings.volume, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+dur+0.03);
}
function noiseBurst(dur, vol=0.25, cutoff=800){
  if(!audioCtx || settings.volume === 0) return;
  const t = audioCtx.currentTime, n = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 1.5);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cutoff;
  const g = audioCtx.createGain(); g.gain.value = vol * settings.volume;
  src.connect(f).connect(g).connect(audioCtx.destination); src.start(t);
}
const sfx = {
  shoot:  () => beep(720, 0.06, 'square', 0.05, 380), bomb: () => beep(240, 0.1, 'triangle', 0.1, 120),
  boom:   () => { noiseBurst(0.45, 0.3, 600); beep(95, 0.4, 'sine', 0.22, 35); }, hit: () => beep(950, 0.06, 'square', 0.06, 500),
  pickup: () => { beep(600, 0.07, 'triangle', 0.09); setTimeout(()=>beep(950, 0.1, 'triangle', 0.09), 70); },
  fall:   () => beep(420, 0.5, 'sawtooth', 0.12, 70), win: () => { beep(523, 0.14, 'triangle', 0.15); setTimeout(()=>beep(784, 0.18, 'triangle', 0.15), 140); setTimeout(()=>beep(1046, 0.3, 'triangle', 0.15), 300); }
};

// ================== SABİTLER & ARENALAR ==================
const GRAVITY = 2000, MOVE_SPEED = 330, JUMP_VELOCITY = -800, DEATH_Y = H + 80, FIRE_COOLDOWN = 0.30, BOMB_COOLDOWN = 1.2, START_BOMBS = 3;
const arenas = [
  { name: 'Orman', platforms: [{x: 60, y: 380, w: 840, h: 60},{x: 230, y: 270, w: 190, h: 20},{x: 540, y: 270, w: 190, h: 20},{x: 170, y: 470, w: 130, h: 30},{x: 660, y: 470, w: 130, h: 30}] },
  { name: 'Çatlak Zemin', platforms: [{x:0, y:H-40, w:260, h:40},{x:340, y:H-40, w:280, h:40},{x:W-260, y:H-40, w:260, h:40},{x:90, y:H-180, w:200, h:20},{x:W-290, y:H-180, w:200, h:20},{x:W/2-100, y:H-300, w:200, h:20}] },
  { name: 'Üç Ada', platforms: [{x:60, y:H-40, w:180, h:40},{x:W/2-110, y:H-40, w:220, h:40},{x:W-240, y:H-40, w:180, h:40},{x:W/2-150, y:H-190, w:300, h:20},{x:W/2-70, y:H-320, w:140, h:20}] },
  { name: 'Kule', platforms: [{x:0, y:H-40, w:200, h:40},{x:W-200, y:H-40, w:200, h:40},{x:W/2-60, y:H-150, w:120, h:20},{x:W/2-160,y:H-260, w:320, h:20},{x:W/2-60, y:H-370, w:120, h:20},{x:100, y:H-210, w:140, h:20},{x:W-240, y:H-210, w:140, h:20}] },
];
let arenaIndex = 0, platforms = arenas[arenaIndex].platforms;

// ================== GİRDİ ==================
const keys = {};
addEventListener('keydown', e => {
  if(e.code === 'Escape') { toggleMenu(); return; }
  initAudio(); keys[e.code] = true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','Slash','Tab'].includes(e.code)) e.preventDefault();
  if(!isPaused && document.getElementById('start-menu').style.display === 'none') {
    if(e.code === 'KeyR') resetGame();
    if(e.code === 'KeyN'){ arenaIndex = (arenaIndex+1) % arenas.length; resetGame(); }
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('pointerdown', initAudio);

// ================== DURUM ==================
let bullets = [], bombs = [], pickups = [], explosions = [], particles = [], shake = 0, winner = null, pickupTimer = 2.5, players = [];

function makePlayer(cfg) {
  return Object.assign({
    w:28, h:40, vx:0, vy:0, onGround:false, damage:0, facing:1, fireCd:0, bombCd:0, hitstun:0,
    stocks: settings.stocks, alive:true, respawn:0, bombs:START_BOMBS
  }, cfg);
}

function resetGame(){
  platforms = arenas[arenaIndex].platforms;
  players = [
    makePlayer({id:1, x:120, y:H-120, color:'#4fc3f7', charId: selections.p1Char, wepId: selections.p1Wep, left:'KeyA', right:'KeyD', jump:'KeyW', shoot:'KeyF', bomb:'KeyG'}),
    makePlayer({id:2, x:W-148, y:H-120, color:'#ff7043', charId: selections.p2Char, wepId: selections.p2Wep, left:'ArrowLeft', right:'ArrowRight', jump:'ArrowUp', shoot:'Enter', bomb:'Slash'}),
  ];
  bullets = []; bombs = []; pickups = []; explosions = []; particles = [];
  winner = null; shake = 0; pickupTimer = 2.5;
}

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

// ================== PARÇACIKLAR & SİLAHLAR ==================
function spawnParticles(x, y, count, opts={}){
  if(!settings.particles) return;
  const speed = opts.speed || 220, life = opts.life || 0.5, size = opts.size || 4, gravity = opts.gravity !== undefined ? opts.gravity : 700;
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, sp = speed * (0.4 + Math.random()*0.9);
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 60, life: life * (0.6 + Math.random()*0.7), maxLife: life, size: size * (0.6 + Math.random()*0.9), color: opts.color || '#ffbe3c', gravity });
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i]; p.vy += p.gravity * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.life -= dt;
    if(p.life <= 0) particles.splice(i,1);
  }
}
function drawParticles(){
  if(!settings.particles) return;
  for(const p of particles){
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.maxLife)); ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function spawnBullet(p){
  bullets.push({ x: p.x + p.w/2 + p.facing*20, y: p.y + p.h*0.4, w:14, h:6, vx: p.facing * 950, owner: p.id, damage: 8, life: 0.9, wepId: p.wepId });
  sfx.shoot();
}
function spawnBomb(p){
  bombs.push({ x: p.x + p.w/2 - 12, y: p.y + 6, w: 24, h: 24, vx: p.facing * 420, vy: -420, owner: p.id, fuse: 1.5 });
  p.bombCd = BOMB_COOLDOWN; p.bombs--; sfx.bomb();
}
function applyBulletHit(p, b){
  const dir = Math.sign(b.vx) || 1; p.damage += b.damage;
  p.vx = dir * (220 + p.damage * 11); p.vy = -220 - p.damage * 2.2;
  p.hitstun = 0.28; p.onGround = false;
  if(settings.shake) shake = 7;
  spawnParticles(b.x + b.w/2, b.y + b.h/2, 8, {color:'#ffe066', life:0.35, speed:180, size:3});
  sfx.hit();
}
function explodeBomb(b){
  const R = 110, cx = b.x + b.w/2, cy = b.y + b.h/2;
  explosions.push({x:cx, y:cy, r:0, maxR:R, t:0, life:0.4});
  spawnParticles(cx, cy, 26, {color:'#ffbe3c', life:0.55, speed:420, size:6});
  spawnParticles(cx, cy, 14, {color:'#ff5f3c', life:0.65, speed:320, size:5});
  spawnParticles(cx, cy, 10, {color:'#ffffff', life:0.30, speed:200, size:3});
  for(const p of players){
    if(!p.alive) continue;
    const px = p.x + p.w/2, py = p.y + p.h/2, dx = px - cx, dy = py - cy, dist = Math.hypot(dx, dy);
    if(dist < R){
      const falloff = 1 - dist / R; p.damage += 8 + 12 * falloff;
      const dir = dx >= 0 ? 1 : -1; p.vx = dir * (380 + p.damage * 12) * (0.5 + falloff*0.5);
      p.vy = -380 - p.damage * 2.5 * falloff; p.hitstun = 0.4; p.onGround = false;
    }
  }
  if(settings.shake) shake = 16; sfx.boom();
}

// ================== OYUNCU & FİZİK ==================
function updatePlayer(p, dt){
  if(!p.alive){
    p.respawn -= dt;
    if(p.respawn <= 0 && p.stocks > 0){
      p.alive = true; p.damage = 0; p.hitstun = 0; p.vx = p.vy = 0; p.bombs = START_BOMBS;
      p.x = p.id === 1 ? 120 : W - 148; p.y = 40;
    }
    return;
  }
  p.fireCd -= dt; p.bombCd -= dt;

  if(p.hitstun > 0){ p.hitstun -= dt; p.vx *= Math.exp(-2.5 * dt); }
  else {
    let ax = 0; if(keys[p.right]) ax += 1; if(keys[p.left]) ax -= 1;
    p.vx = ax * MOVE_SPEED; if(ax !== 0) p.facing = ax;
    if(keys[p.jump] && p.onGround){ p.vy = JUMP_VELOCITY; p.onGround = false; }
    if(keys[p.shoot] && p.fireCd <= 0){ spawnBullet(p); p.fireCd = FIRE_COOLDOWN; p.vx -= p.facing * 60; }
    if(keys[p.bomb] && p.bombCd <= 0 && p.bombs > 0) spawnBomb(p);
  }

  p.vy = Math.min(p.vy + GRAVITY * dt, 1500);
  p.x = clamp(p.x + p.vx * dt, 0, W - p.w);
  if(p.x <= 0 || p.x >= W - p.w) p.vx = 0;

  const prevBottom = p.y + p.h; p.y += p.vy * dt; p.onGround = false;
  if(p.vy >= 0){
    for(const pl of platforms){
      if(p.x + p.w > pl.x && p.x < pl.x + pl.w && prevBottom <= pl.y + 1 && p.y + p.h >= pl.y){
        p.y = pl.y - p.h; p.vy = 0; p.onGround = true;
      }
    }
  }

  if(p.y > DEATH_Y){
    p.alive = false; p.stocks -= 1; p.respawn = 1.0;
    if(settings.shake) shake = 10; sfx.fall();
    spawnParticles(clamp(p.x + p.w/2, 20, W-20), H-10, 16, {color:'#ff6b6b', life:0.6, speed:280, size:4, gravity:200});
    if(p.stocks <= 0 && !winner){ winner = players.find(q => q.id !== p.id); sfx.win(); }
  }
}

function updateBullets(dt){
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i]; b.x += b.vx * dt; b.life -= dt;
    let dead = b.life <= 0 || b.x < -60 || b.x > W + 60;
    if(!dead) for(const pl of platforms){
      if(b.x+b.w > pl.x && b.x < pl.x+pl.w && b.y+b.h > pl.y && b.y < pl.y+pl.h){
        spawnParticles(b.x, b.y+b.h/2, 4, {color:'#ffe066', life:0.25, speed:100, size:2}); dead = true; break;
      }
    }
    if(!dead) for(const p of players){
      if(!p.alive || p.id === b.owner) continue;
      if(b.x+b.w > p.x && b.x < p.x+p.w && b.y+b.h > p.y && b.y < p.y+p.h){ applyBulletHit(p, b); dead = true; break; }
    }
    if(dead) bullets.splice(i, 1);
  }
}
function updateBombs(dt){
  for(let i = bombs.length - 1; i >= 0; i--){
    const b = bombs[i]; b.vy = Math.min(b.vy + GRAVITY * dt, 1400); b.x += b.vx * dt; b.y += b.vy * dt;
    if(b.x < 0){ b.x = 0; b.vx = -b.vx * 0.5; } if(b.x + b.w > W){ b.x = W - b.w; b.vx = -b.vx * 0.5; }
    if(b.vy >= 0) for(const pl of platforms){
      if(b.x + b.w > pl.x && b.x < pl.x + pl.w && b.y + b.h - b.vy*dt <= pl.y && b.y + b.h >= pl.y){
        b.y = pl.y - b.h; b.vy = -b.vy * 0.45; b.vx *= 0.85; if(Math.abs(b.vy) < 120) b.vy = 0;
      }
    }
    b.fuse -= dt; if(b.y > DEATH_Y){ bombs.splice(i, 1); continue; }
    if(b.fuse <= 0){ explodeBomb(b); bombs.splice(i, 1); }
  }
}
function updateExplosions(dt){
  for(let i = explosions.length - 1; i >= 0; i--){
    const e = explosions[i]; e.t += dt; e.r = e.maxR * (e.t / e.life);
    if(e.t >= e.life) explosions.splice(i, 1);
  }
}
function updatePickups(dt){
  pickupTimer -= dt;
  if(pickupTimer <= 0 && pickups.length < 3){
    const pl = platforms[Math.floor(Math.random()*platforms.length)];
    pickups.push({x: pl.x + 30 + Math.random() * Math.max(10, pl.w - 80), y: pl.y - 30, w:20, h:20, bob:0, life:14});
    pickupTimer = 3.5 + Math.random()*2.5;
  }
  for(let i=pickups.length-1;i>=0;i--){
    const pk = pickups[i]; pk.life -= dt; pk.bob += dt * 4;
    if(pk.life <= 0){ pickups.splice(i,1); continue; }
    for(const p of players){
      if(!p.alive || p.bombs >= settings.maxBombs) continue;
      if(p.x+p.w > pk.x && p.x < pk.x+pk.w && p.y+p.h > pk.y && p.y < pk.y+pk.h){
        p.bombs = Math.min(settings.maxBombs, p.bombs+1); sfx.pickup();
        spawnParticles(pk.x+pk.w/2, pk.y+pk.h/2, 12, {color:'#7cf7a0', life:0.6, speed:220, size:3});
        pickups.splice(i,1); break;
      }
    }
  }
}

// ================== ÇİZİM FONKSİYONLARI ==================
function drawJungleBackground() {
  ctx.fillStyle = '#cbeef3'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#d4d1c9'; ctx.beginPath(); ctx.moveTo(100, H); ctx.lineTo(300, 150); ctx.lineTo(500, H); ctx.fill();
  ctx.fillStyle = '#e3dfd6'; ctx.beginPath(); ctx.moveTo(600, H); ctx.lineTo(800, 100); ctx.lineTo(W+50, H); ctx.fill();
  function drawHut(x, y) {
    ctx.fillStyle = '#e8b03c'; ctx.beginPath(); ctx.moveTo(x, y + 60); ctx.lineTo(x, y + 20); ctx.quadraticCurveTo(x + 35, y - 20, x + 70, y + 20); ctx.lineTo(x + 70, y + 60); ctx.fill();
    ctx.fillStyle = '#3b291b'; ctx.beginPath(); ctx.moveTo(x + 25, y + 60); ctx.lineTo(x + 25, y + 35); ctx.quadraticCurveTo(x + 35, y + 25, x + 45, y + 35); ctx.lineTo(x + 45, y + 60); ctx.fill();
  }
  drawHut(80, 250); drawHut(760, 250);
  ctx.fillStyle = '#8b5a2b'; ctx.fillRect(W/2 - 10, 100, 20, 200);
  ctx.fillStyle = '#318e36'; ctx.beginPath(); ctx.ellipse(W/2, 100, 150, 40, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(W/2 - 70, 120, 80, 30, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(W/2 + 70, 120, 80, 30, 0, 0, Math.PI * 2); ctx.fill();
}
function drawPlatform(pl) {
  ctx.fillStyle = '#8b5a2b'; ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
  ctx.fillStyle = '#4caf50'; ctx.fillRect(pl.x, pl.y, pl.w, 8);
  ctx.strokeStyle = '#2a1a10'; ctx.lineWidth = 3; ctx.strokeRect(pl.x, pl.y, pl.w, pl.h);
}

function drawPlayer(p){
  if(!p.alive) return;
  
  // RESİM ÇİZİMİ (Karakter)
  let img = p.charId === 1 ? images.p1 : images.p2;
  if (img.complete && img.naturalWidth > 0) {
    ctx.save();
    if (p.facing < 0) {
      ctx.translate(p.x + p.w/2, p.y);
      ctx.scale(-1, 1);
      ctx.drawImage(img, -p.w/2, 0, p.w, p.h);
    } else {
      ctx.drawImage(img, p.x, p.y, p.w, p.h);
    }
    ctx.restore();
    if(p.hitstun > 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(p.x, p.y, p.w, p.h);
    }
  } else {
    // Yedek Görsel (Resim yoksa)
    ctx.save();
    ctx.globalAlpha = p.hitstun > 0 ? 0.75 : 1;
    ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    const eyeX = p.facing > 0 ? p.x + p.w - 12 : p.x + 5;
    ctx.fillRect(eyeX, p.y + 8, 7, 7); ctx.restore();
  }

  // Hasar yüzdesi
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(Math.floor(p.damage) + '%', p.x + p.w/2, p.y - 8);
}

function drawBullets() {
  for(const b of bullets) {
    let img = b.wepId === 1 ? images.w1 : images.w2;
    if (img.complete && img.naturalWidth > 0) {
      ctx.save();
      if (b.vx < 0) {
        ctx.translate(b.x + b.w/2, b.y + b.h/2);
        ctx.scale(-1, 1);
        ctx.drawImage(img, -b.w/2, -b.h/2, b.w, b.h);
      } else {
        ctx.drawImage(img, b.x, b.y, b.w, b.h);
      }
      ctx.restore();
    } else {
      ctx.fillStyle = '#ffd54f'; ctx.fillRect(b.x, b.y, b.w, b.h);
    }
  }
}

function drawBomb(b){
  const cx = b.x + b.w/2, cy = b.y + b.h/2;
  ctx.fillStyle = '#15181d'; ctx.beginPath(); ctx.arc(cx, cy, b.w/2, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#444b55'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, b.w/2 - 1, 0, Math.PI*2); ctx.stroke();
  if(Math.sin(b.fuse * 22) > -0.2 || b.fuse < 0.5){ ctx.fillStyle = '#ffb74d'; ctx.beginPath(); ctx.arc(cx, cy - b.h/2 - 3, 3.5, 0, Math.PI*2); ctx.fill(); }
  if(b.fuse < 0.5){
    const a = 0.5 + Math.sin(b.fuse * 45) * 0.5; ctx.strokeStyle = `rgba(255,70,70,${a})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, b.w/2 + 6, 0, Math.PI*2); ctx.stroke();
  }
}
function drawPickup(pk){
  const cx = pk.x + pk.w/2, cy = pk.y + pk.h/2 + Math.sin(pk.bob)*3;
  ctx.globalAlpha = Math.min(1, pk.life);
  const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, 22); g.addColorStop(0, 'rgba(124,247,160,0.55)'); g.addColorStop(1, 'rgba(124,247,160,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 22, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#15181d'; ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#7cf7a0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#7cf7a0'; ctx.beginPath(); ctx.arc(cx, cy-12, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawExplosions(){
  for(const e of explosions){
    const alpha = 1 - e.t / e.life;
    ctx.fillStyle = `rgba(255,190,60,${alpha*0.55})`; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = `rgba(255,255,210,${alpha*0.9})`; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.45, 0, Math.PI*2); ctx.fill();
  }
}

function render(){
  ctx.save();
  if(shake > 0 && settings.shake) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  if (arenas[arenaIndex].name === 'Orman') drawJungleBackground();
  else { ctx.fillStyle = '#1b2430'; ctx.fillRect(-20, -20, W+40, H+40); }

  const grad = ctx.createLinearGradient(0, H-10, 0, H+40); grad.addColorStop(0, 'rgba(255,40,40,0)'); grad.addColorStop(1, 'rgba(255,40,40,0.55)');
  ctx.fillStyle = grad; ctx.fillRect(0, H-10, W, 50);

  for(const pl of platforms){
    if (arenas[arenaIndex].name === 'Orman') {
      drawPlatform(pl);
      if (pl.w === 840) {
        ctx.fillStyle = '#cbeef3'; ctx.beginPath(); ctx.moveTo(pl.x + 350, pl.y + 15); ctx.quadraticCurveTo(W/2, pl.y + 80, pl.x + 490, pl.y + 15); ctx.lineTo(pl.x + 490, pl.y + pl.h); ctx.lineTo(pl.x + 350, pl.y + pl.h); ctx.fill();
        ctx.strokeStyle = '#2a1a10'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(pl.x + 350, pl.y + 15); ctx.quadraticCurveTo(W/2, pl.y + 80, pl.x + 490, pl.y + 15); ctx.stroke();
        ctx.fillStyle = '#8b5a2b'; ctx.fillRect(W/2 - 40, pl.y + 15, 80, pl.h); ctx.strokeRect(W/2 - 40, pl.y + 15, 80, pl.h);
        ctx.fillStyle = '#4caf50'; ctx.fillRect(W/2 - 40, pl.y + 15, 80, 8); ctx.strokeRect(W/2 - 40, pl.y + 15, 80, 8);
      }
    } else {
      ctx.fillStyle = '#2f3b4c'; ctx.fillRect(pl.x, pl.y, pl.w, pl.h); ctx.fillStyle = '#3d4b60'; ctx.fillRect(pl.x, pl.y, pl.w, 4);
    }
  }

  for(const pk of pickups) drawPickup(pk);
  drawBullets();
  for(const b of bombs) drawBomb(b);
  drawExplosions();
  drawParticles();
  for(const p of players) drawPlayer(p);

  // HUD
  ctx.textAlign = 'left'; ctx.font = 'bold 16px system-ui';
  players.forEach((p, i) => {
    ctx.fillStyle = p.color; const y = 26 + i*32;
    ctx.fillText(`P${p.id}  Can: ${'♥'.repeat(Math.max(0,p.stocks))}  Hasar: ${Math.floor(p.damage)}%`, 16, y);
    const bombDots = Math.min(p.bombs, 10);
    for(let k=0;k<settings.maxBombs;k++){
      if(k > 9) break;
      const bx = 16 + k*16, by = y + 6;
      ctx.beginPath(); ctx.arc(bx+6, by+5, 5, 0, Math.PI*2);
      if(k < bombDots){ ctx.fillStyle = p.color; ctx.fill(); } else { ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1.5; ctx.stroke(); }
    }
  });

  ctx.textAlign = 'right'; ctx.fillStyle = arenas[arenaIndex].name === 'Orman' ? '#000' : '#8b949e';
  ctx.font = 'bold 14px system-ui'; ctx.fillText(`Arena: ${arenas[arenaIndex].name}  (N ile değiştir)`, W - 16, 26);

  if(winner){
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, H/2-60, W, 120);
    ctx.fillStyle = winner.color; ctx.font = 'bold 42px system-ui'; ctx.fillText(`OYUNCU ${winner.id} KAZANDI`, W/2, H/2 + 6);
    ctx.fillStyle = '#8b949e'; ctx.font = '16px system-ui'; ctx.fillText('Yeniden başlatmak için R', W/2, H/2 + 40);
  }
  ctx.restore();
}

// ================== DÖNGÜ ==================
let last = performance.now();
function loop(now){
  const dt = isPaused ? 0 : Math.min((now - last) / 1000, 0.033);
  last = now;

  if(!isPaused && !winner && document.getElementById('start-menu').style.display === 'none'){
    for(const p of players) updatePlayer(p, dt);
    updateBullets(dt); updateBombs(dt); updatePickups(dt);
  }
  if(!isPaused) { updateExplosions(dt); updateParticles(dt); if(shake > 0) shake = Math.max(0, shake - 40*dt); }
  
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
