<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر ميار</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
html, body { height: 100%; overflow: hidden; background: #1a1a1a; }
.tab-bar {
  display: flex;
  background: linear-gradient(135deg, #1a1a1a, #2c2c2c);
  padding: 12px;
  gap: 8px;
  border-bottom: 2px solid #d4af37;
  height: 70px;
}
.tab-btn {
  flex: 1;
  padding: 12px;
  border: 2px solid #d4af37;
  border-radius: 12px;
  background: transparent;
  color: #d4af37;
  font-weight: 800;
  font-size: 1rem;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.tab-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(212,175,55,0.3); }
.tab-btn.active { background: linear-gradient(135deg, #d4af37, #b8942e); color: #fff; }
iframe { width: 100%; height: calc(100vh - 70px); border: none; display: block; background: #f5f3ef; }
</style>
</head>
<body>
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('kozmetik', this)">🛍️ كوزمتيك</button>
  <button class="tab-btn" onclick="switchTab('parfum', this)">🌸 عطور</button>
</div>
<iframe id="siteFrame" src="/kozmetik.html"></iframe>
<script>
function switchTab(site, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('siteFrame').src = '/' + site + '.html';
}
</script>
</body>
</html>
